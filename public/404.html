<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ismaili Center Houston Guide</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current URL and converts the path and query
      // into just query parameters, then redirects to the root URL of the site.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      // If we are on custom domain, pathSegmentsToKeep = 0; if on *.github.io/<repo>/, pathSegmentsToKeep = 1
      if (l.hostname.indexOf('github.io') === -1) {
        pathSegmentsToKeep = 0;
      }

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Ismaili Center Houston Guide...</p>
  </body>
</html>
